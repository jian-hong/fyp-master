models:
  # =====================================================
  # BASE 6 — single-component ablation (Phase 3a)
  # =====================================================
  MR-TAE-FULL:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: true
    use_attention_gates: true
    use_mtl: true
    loss_config: A

  MR-TAE-noBiGRU:
    use_wavelet_pooling: true
    use_bigru: false
    use_swin: true
    use_attention_gates: true
    use_mtl: true
    loss_config: A

  MR-TAE-noSwin:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: false
    use_attention_gates: true
    use_mtl: true
    loss_config: A

  MR-TAE-noAttn:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: true
    use_attention_gates: false
    use_mtl: true
    loss_config: A

  MR-TAE-noMTL:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: true
    use_attention_gates: true
    use_mtl: false
    loss_config: C

  MR-TAE-noWavelet:
    use_wavelet_pooling: false
    use_bigru: true
    use_swin: true
    use_attention_gates: true
    use_mtl: true
    loss_config: A

  # =====================================================
  # TWO-COMPONENT REMOVAL — deeper ablation (Phase 3b)
  # =====================================================
  MR-TAE-noSwin-noBiGRU:
    use_wavelet_pooling: true
    use_bigru: false
    use_swin: false
    use_attention_gates: true
    use_mtl: true
    loss_config: A

  MR-TAE-noSwin-noAttn:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: false
    use_attention_gates: false
    use_mtl: true
    loss_config: A

  MR-TAE-noBiGRU-noAttn:
    use_wavelet_pooling: true
    use_bigru: false
    use_swin: true
    use_attention_gates: false
    use_mtl: true
    loss_config: A

  # =====================================================
  # LOSS FUNCTION VARIANTS — MR-TAE-FULL with B/C configs
  # =====================================================
  MR-TAE-FULL-LossB:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: true
    use_attention_gates: true
    use_mtl: true
    loss_config: B

  MR-TAE-FULL-LossC:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: true
    use_attention_gates: true
    use_mtl: true
    loss_config: C

  # =====================================================
  # CROSS COMBINATIONS — novel architecture blends
  # =====================================================
  MWCNN-BiGRU:
    use_wavelet_pooling: true
    use_bigru: true
    use_swin: false
    use_attention_gates: false
    use_mtl: false
    loss_config: C

  UNet-BiGRU-Swin:
    use_wavelet_pooling: false
    use_bigru: true
    use_swin: true
    use_attention_gates: false
    use_mtl: false
    loss_config: C
